name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Please remove credentials, cookies, and private conversation content from reports and attachments.
  - type: input
    id: version
    attributes:
      label: Glance version
      placeholder: 1.2.8
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and provider
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include what happened and what you expected.
    validations:
      required: true
